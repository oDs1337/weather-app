<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Subtle gradient for depth -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D7F36A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8E054;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <rect width="128" height="128" rx="28" fill="#111820"/>
  
  <!-- V shape - main body -->
  <path d="M36 28 L54 90 L74 90 L92 28 L78 28 L64 72 L50 28 Z" 
        fill="url(#logoGrad)" stroke="none"/>
  
  <!-- Road line through V -->
  <path d="M30 100 Q64 88 98 100" 
        stroke="#D7F36A" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Small accent dot -->
  <circle cx="64" cy="108" r="2" fill="#D7F36A" opacity="0.6"/>
</svg>
