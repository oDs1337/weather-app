<div class="cycling-score-card">
  <div class="card-header" [attr.aria-label]="'cyclingScore.title' | translate">
    <button type="button" class="back-button-inline" (click)="goBack()" [attr.aria-label]="'citySelector.backToCities' | translate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2>{{ 'cyclingScore.title' | translate }}</h2>
    <span class="city-name" [style.color]="cityColor()">{{ city() }}</span>
  </div>

  <section class="hero-score">
    <div class="score-card">
      <div class="radial-chart-container">
        <svg viewBox="0 0 140 140" class="radial-chart" [attr.aria-label]="overallScore() + ' / 100'">
          <defs>
            <linearGradient [attr.id]="gradientId()" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" [attr.stop-color]="gradientStops()[0]" />
              <stop offset="100%" [attr.stop-color]="gradientStops()[1]" />
            </linearGradient>

            <filter [attr.id]="glowFilterId()" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <circle
            cx="70" cy="70" r="55"
            class="track-bg"
            transform="rotate(-90 70 70)"
          />

          <circle
            cx="70" cy="70" r="55"
            class="track-active"
            [attr.stroke]="gradientUrl()"
            [attr.filter]="'url(#' + glowFilterId() + ')'"
            [attr.stroke-dasharray]="circumference"
            [attr.stroke-dashoffset]="strokeDashOffset()"
            stroke-linecap="round"
            transform="rotate(-90 70 70)"
          />

          <circle
            [attr.cx]="endpointDot().x"
            [attr.cy]="endpointDot().y"
            r="9"
            [attr.fill]="endpointColor()"
          />
        </svg>
        <div class="score-text">
          <span class="main-number">{{ overallScore() }}</span>
          <span class="sub-number">/100</span>
        </div>
      </div>

      <div class="status-badge" [class]="badgeClass()">
        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>{{ getOverallLabel() }}</span>
      </div>

      @if (adviceHasContent()) {
        <div class="advice-text">
          {{ dynamicAdvice() }}
        </div>
      }
    </div>
  </section>

  <section class="subscores">
    @for (item of subscores(); track item.key) {
      <div class="subscore-item" [class]="item.group">
        <span class="icon-wrapper" aria-hidden="true">
          <img [src]="item.iconSrc" [alt]="item.titleKey | translate"/>
        </span>

        <div class="subscore-info">
          <span class="subscore-title">{{ item.titleKey | translate }}</span>
          <span class="badge inline-badge" [class]="item.group">{{ item.status }}</span>
        </div>

        <span class="subscore-score" [attr.aria-label]="item.value + ' out of 100'">{{ item.value }}/100</span>
      </div>
    }
  </section>
</div>
