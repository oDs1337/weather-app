<div class="weather-container">
  @if (loading()) {
    <app-loading />
  } @else if (error()) {
    <app-error [error]="error()!" />
  } @else if (data() && cyclingScore()) {
    <div class="weather-content fade-in-up">
      <!-- Back Button -->
      <button class="back-btn" (click)="goBack()">
        {{ 'citySelector.backToCities' | translate }}
      </button>

      <!-- Cycling Score Card -->
      <section class="cycling-score-section">
        <app-cycling-score-card 
          [score]="cyclingScore()!" 
          [city]="selectedCityName()" 
        />
        <!-- Dynamic Advice Box -->
        @if (dynamicAdvice()) {
          <div class="dynamic-advice-box fade-in-up">
            <p>{{ dynamicAdvice() }}</p>
          </div>
        }
      </section>

      <!-- Cycling Alerts -->
      @if (cyclingIssues().length > 0) {
        <section class="cycling-alerts-section">
          <app-cycling-alerts [issues]="cyclingIssues()" />
        </section>
      }

      <!-- Air Quality Info -->
      @if (airQuality()) {
        <section class="air-quality-section">
          <app-air-quality [data]="airQuality()!" />
        </section>
      }
      
      <!-- Current Weather Card -->
      <app-current-weather-card [current]="data()!.current" />

      <!-- Hourly Forecast Chart -->
      <section class="hourly-section">
        <h3>{{ 'forecast.today' | translate }}</h3>
        <app-hourly-chart [hourly]="data()!.hourly" />
      </section>

      <!-- Daily Forecast -->
      <section class="daily-section">
        <h3>{{ 'forecast.tomorrow' | translate }} +</h3>
        <app-daily-forecast [daily]="data()!.daily" />
      </section>
    </div>
  }
</div>
